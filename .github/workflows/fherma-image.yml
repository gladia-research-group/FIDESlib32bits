# Builds docker/Dockerfile.fherma and pushes it to ghcr.io/<owner>/fideslib32bits, the image
# proposed to FHERMA. A v* tag publishes that version (v1.0.0 -> :1.0.0); a manual run
# publishes the branch it ran on. The digest, which is what FHERMA pins, is written to the
# run summary.
name: fherma-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The CUDA devel base alone is ~5.4 GB compressed; the runner's preinstalled toolchains
      # are not needed and leave too little room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fideslib32bits
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.fherma
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}

      - name: Digest
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/fideslib32bits@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Built from \`${{ github.sha }}\`, docker/Dockerfile.fherma."
          } >> "$GITHUB_STEP_SUMMARY"
